services:
  - type: web
    name: aqualearn-backend
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn aqualearn.wsgi:application --bind 0.0.0.0:8000
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-app.netlify.app"
      - key: FRONTEND_URL
        value: "https://your-app.netlify.app"
      - key: DJANGO_EMAIL_HOST_USER
        sync: false
      - key: DJANGO_EMAIL_HOST_PASSWORD
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1